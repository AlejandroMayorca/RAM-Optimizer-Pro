name: Sugerir una idea / Feature request
description: Propón una mejora / Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: ¿Qué te gustaría? / What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: ¿Por qué sería útil? / Why would it help?
